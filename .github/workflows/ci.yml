name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: chrome
      - run: ${{ steps.chrome.outputs.chrome-path }} --version
      - run: cp .env.example .env
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        run: bun run naming:subject
        env:
          CHANGE_SUBJECT: ${{ github.event.pull_request.title }}
      - run: bun run verify
        env:
          CHANGE_BRANCH: ${{ github.head_ref || github.ref_name }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
