name: Feature request
description: Propose a new capability or improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: List the checks that show the work is complete.
    validations:
      required: true
