name: Bug report
description: Report behavior that needs a fix.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the shortest steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Describe the result that would close this issue.
    validations:
      required: true
