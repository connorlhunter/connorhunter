version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g bun@1.3.14
        - bun --version
        - bun install --frozen-lockfile
    build:
      commands:
        - bun run build
  artifacts:
    baseDirectory: dist/client
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - ~/.bun/install/cache/**/*
